name: languages
on:
  schedule: [{ cron: "17 19 * * *" }]   # daily, 03:17 HKT
  workflow_dispatch:
  push: { branches: [master], paths: [scripts/languages.py, .github/workflows/languages.yml] }
permissions: { contents: write }
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/languages.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_LOGIN: ${{ github.repository_owner }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages.svg
          git diff --cached --quiet || git commit -m "languages: refresh" && git push
